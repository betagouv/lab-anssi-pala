services:
  pala-db:
    image: docker.io/postgres:17
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - reseau-pala
    ports:
      - '5432:5432'
    volumes:
      - dbvol:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1 -p 5432']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  serveur:
    build:
      context: .
      dockerfile: ./Dockerfile-BACK
      args:
        NODE_VERSION: '${NODE_VERSION:?NODE_VERSION non definie (utilise make up, ou exporte-la depuis .nvmrc)}'
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - NB_REQUETES_MAX_PAR_MINUTE=1000
    ports:
      - '8086:8086'
    volumes:
      - ./serveur/front/src:/app/serveur/front/src
      - ./serveur/front/assets:/app/serveur/front/assets
      - ./serveur/back/src:/app/serveur/back/src
      - ./noyau-partage/src:/app/noyau-partage/src
    networks:
      - reseau-pala
    depends_on:
      pala-db:
        condition: service_healthy

  cli:
    build:
      context: .
      dockerfile: ./Dockerfile-CLI
      args:
        NODE_VERSION: '${NODE_VERSION:?NODE_VERSION non definie (utilise make up, ou exporte-la depuis .nvmrc)}'
    env_file:
      - .env
    command: ['sh', '-c', 'pnpm run migration-bdd && tail -f /dev/null']
    init: true
    networks:
      - reseau-pala
    develop:
      watch:
        - action: rebuild
          path: ./noyau-partage

        - action: rebuild
          path: ./outillage
    depends_on:
      pala-db:
        condition: service_healthy

networks:
  reseau-pala:
    external: true

volumes:
  dbvol:
    driver: local
