services:
  pala-db:
    image: docker.io/postgres:17
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
    networks:
      - reseau-pala
    ports:
      - '5432:5432'
    volumes:
      - dbvol:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d/:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -h 127.0.0.1 -p 5432']
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
