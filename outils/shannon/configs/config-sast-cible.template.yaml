# Scénario : SAST agentique (Capella) activé, sans exploitation (exploit: "false").
# Shannon lit le dépôt pour repérer des failles avant/à la place de la phase dynamique. Produit une
# sortie de nature statique, comparable à un autre outil d'analyse de code.
#
# Copier vers configs/config-<cible>-sast.yaml (ignoré par git). Le SAST agentique ajoute du temps
# et du coût modèle. Schéma complet : source/docs/configuration.md.
description: >
  Application cible en local (Docker), base de données jetable, données de test uniquement.
  Décrire la pile technique et le périmètre du dépôt à analyser.

exploit: "false"

agentic_sast:
  enabled: "true"

