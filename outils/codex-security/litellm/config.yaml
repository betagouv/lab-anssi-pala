# Proxy LiteLLM : expose l'API Responses d'OpenAI (/v1/responses), seule API que parle
# Codex (>= 0.1xx : `wire_api = "chat"` n'est plus supporté), et la traduit vers
# /v1/chat/completions d'Albert, qui n'expose pas /v1/responses (404).
#
# Lancé par outils/codex-security/scripts/start-proxy.sh, exposé sur 127.0.0.1 uniquement.
# La clé Albert reste dans le proxy ; Codex ne connaît que LITELLM_MASTER_KEY (jeton local).
model_list:
  - model_name: gpt-oss-120b
    litellm_params:
      # Préfixe hosted_vllm/ : Albert est servi par vLLM ; l'alias Albert est openai/gpt-oss-120b.
      model: hosted_vllm/openai/gpt-oss-120b
      api_base: os.environ/ALBERT_BASE_URL
      api_key: os.environ/ALBERT_API_KEY
      # Sans cette option, LiteLLM relaie tel quel vers /v1/responses d'Albert (404).
      use_chat_completions_api: true
      timeout: 600
  - model_name: deepseek-v4-flash-0731
    litellm_params:
      # Scaleway (API compatible OpenAI) : /v1/responses n'y est servi que pour gpt-oss-120b.
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: https://api.scaleway.ai/fcbbc9c9-62a8-49f0-a5b9-606a62ecf9d8/v1
      api_key: os.environ/SCALEWAY_DEEPSEEK_API_KEY
      use_chat_completions_api: true
      timeout: 600
      # Paramètres d'échantillonnage imposés par le proxy : Codex ne sait pas les transmettre.
      # Le streaming reste actif (Codex l'exige) ; reasoning_effort vient de la config Codex.
      max_tokens: 16384
      temperature: 1
      top_p: 1
      presence_penalty: 0

litellm_settings:
  # Remplace json_schema par json_object (voir json_schema_to_object.py).
  callbacks: json_schema_to_object.json_schema_vers_objet
