# Proxy LiteLLM : expose l'API Responses d'OpenAI (/v1/responses), seule API que parle
# Codex (>= 0.1xx : `wire_api = "chat"` n'est plus supporté), et la traduit vers
# /v1/chat/completions d'Albert, qui n'expose pas /v1/responses (404).
#
# Lancé par outils/codex-security/scripts/start-proxy.sh, exposé sur 127.0.0.1 uniquement.
# La clé Albert reste dans le proxy ; Codex ne connaît que LITELLM_MASTER_KEY (jeton local).
model_list:
  - model_name: gpt-oss-120b
    litellm_params:
      # Préfixe hosted_vllm/ : Albert est servi par vLLM ; l'alias Albert est openai/gpt-oss-120b.
      model: hosted_vllm/openai/gpt-oss-120b
      api_base: os.environ/ALBERT_BASE_URL
      api_key: os.environ/ALBERT_API_KEY
      # Sans cette option, LiteLLM relaie tel quel vers /v1/responses d'Albert (404).
      use_chat_completions_api: true
      timeout: 600
