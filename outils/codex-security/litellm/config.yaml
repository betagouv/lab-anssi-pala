# Proxy LiteLLM : expose l'API Responses d'OpenAI (/v1/responses), seule API que parle
# Codex (>= 0.1xx : `wire_api = "chat"` n'est plus supporté), et la traduit vers
# /v1/chat/completions du fournisseur (FOURNISSEUR_BASE_URL), qui n'expose pas /v1/responses
# pour ces modèles (404 chez Albert, 422 chez Scaleway).
#
# Lancé par outillage/bash/codex-security/start-proxy.sh, exposé sur 127.0.0.1 uniquement.
# La clé du fournisseur (FOURNISSEUR_API_KEY) reste dans le proxy ; Codex ne connaît que
# LITELLM_MASTER_KEY (jeton local). Chaque entrée porte l'identifiant du modèle chez son
# fournisseur : choisir dans la config Codex celle qui correspond à FOURNISSEUR_NOM.
model_list:
  - model_name: gpt-oss-120b
    litellm_params:
      # Préfixe hosted_vllm/ : Albert est servi par vLLM ; l'alias Albert est openai/gpt-oss-120b.
      model: hosted_vllm/openai/gpt-oss-120b
      api_base: os.environ/FOURNISSEUR_BASE_URL
      api_key: os.environ/FOURNISSEUR_API_KEY
      # Sans cette option, LiteLLM relaie tel quel vers /v1/responses du fournisseur (404 chez Albert).
      use_chat_completions_api: true
      timeout: 600
      # Albert (DINUM) : service gratuit -> coût nul, ne consomme jamais le budget.
      input_cost_per_token: 0
      output_cost_per_token: 0
  - model_name: deepseek-v4-flash-0731
    litellm_params:
      # Scaleway (API compatible OpenAI) : /v1/responses n'y est servi que pour gpt-oss-120b.
      model: hosted_vllm/deepseek-v4-flash-0731
      api_base: os.environ/FOURNISSEUR_BASE_URL
      api_key: os.environ/FOURNISSEUR_API_KEY
      use_chat_completions_api: true
      timeout: 600
      # Paramètres d'échantillonnage imposés par le proxy : Codex ne sait pas les transmettre.
      # Le streaming reste actif (Codex l'exige) ; reasoning_effort vient de la config Codex.
      max_tokens: 16384
      temperature: 1
      top_p: 1
      presence_penalty: 0
      # Tarif Scaleway ($/token) : nécessaire pour que max_budget s'applique (sinon LiteLLM
      # compte 0 pour un modèle hosted_vllm). Aligné sur scripts/estimer-cout.py : 0,40/0,80 €/M.
      input_cost_per_token: 0.0000004
      output_cost_per_token: 0.0000008
  - model_name: deepseek-v4-flash-albert
    litellm_params:
      # DeepSeek V4 Flash servi par Albert (vLLM) ; alias Albert deepseek-ai/DeepSeek-V4-Flash-0731.
      model: hosted_vllm/deepseek-ai/DeepSeek-V4-Flash-0731
      api_base: os.environ/FOURNISSEUR_BASE_URL
      api_key: os.environ/FOURNISSEUR_API_KEY
      use_chat_completions_api: true
      timeout: 600
      # Albert (vLLM) n'appelle les outils que si tool_choice est explicite : sans cela,
      # DeepSeek n'émet aucun appel (défaut = none). Codex ne le fixe pas -> on l'impose ici.
      tool_choice: auto
      # Paramètres d'échantillonnage alignés sur l'entrée Scaleway : test de l'hypothèse selon
      # laquelle les défauts vLLM d'Albert expliquent la qualité dégradée (scan du 28/09).
      max_tokens: 16384
      temperature: 1
      top_p: 1
      presence_penalty: 0
      # DeepSeek servi par Albert (DINUM) : gratuit -> coût nul.
      input_cost_per_token: 0
      output_cost_per_token: 0

litellm_settings:
  # Remplace json_schema par json_object (voir json_schema_to_object.py).
  callbacks: json_schema_to_object.json_schema_vers_objet
  # Plafond de dépense GLOBAL du proxy (en $), tous modèles payants confondus. Une fois atteint,
  # LiteLLM refuse les appels suivants (BudgetExceededError). Albert étant à coût nul, seul le
  # trafic Scaleway le consomme. Ajuster la valeur selon le besoin ; budget_duration remet à zéro.
  max_budget: 10
  budget_duration: 30d
