name: Préparer l'environnement
description: Installe Node.js et restaure les dépendances mises en cache par le job « dependances »

runs:
  using: composite
  steps:
    - name: Installe pnpm
      uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      with:
        version: 10.34.6

    - name: Utiliser la version Node.js du .nvmrc
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc

    - name: Restaurer les dépendances
      uses: actions/cache/restore@v4
      with:
        path: |
          node_modules
          noyau-partage/node_modules
          serveur/back/node_modules
          serveur/front/node_modules
          outillage/node_modules
        key: node-modules-v2-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        fail-on-cache-miss: true
